name: fasodata

# ── Production — VPS Hostinger 145.223.103.103 ───────────────────────────────
# FasoData écoute sur le port 8090 (FASTPANEL proxy → domaine HTTPS)
# Kafundo tourne sur le port 8080 sur le même VPS

services:

  # ─── Reverse Proxy FasoData ──────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8090:80"          # ← port 8090 pour cohabiter avec Kafundo (8080)
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    networks:
      - faso
    restart: unless-stopped

  # ─── Frontend Next.js ────────────────────────────────────────────────────────
  web:
    image: fasodata-web:prod
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.web.prod
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    env_file:
      - ../.env.production
    environment:
      - NODE_ENV=production
      - API_INTERNAL_URL=http://api:8000/api
    networks:
      - faso
    restart: unless-stopped

  # ─── API FastAPI ──────────────────────────────────────────────────────────────
  api:
    image: fasodata-api:prod
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    env_file:
      - ../.env.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      meilisearch:
        condition: service_started
    networks:
      - faso
    restart: unless-stopped

  # ─── Worker Celery ────────────────────────────────────────────────────────────
  worker:
    image: fasodata-api:prod
    command: celery -A fasodata.core.celery_app worker --loglevel=info -Q default,imports,exports,prices
    env_file:
      - ../.env.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - faso
    restart: unless-stopped

  # ─── Celery Beat (tâches planifiées) ─────────────────────────────────────────
  beat:
    image: fasodata-api:prod
    command: celery -A fasodata.core.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler
    env_file:
      - ../.env.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - faso
    restart: unless-stopped

  # ─── PostgreSQL + PostGIS ─────────────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-fasodata}
      POSTGRES_USER:     ${POSTGRES_USER:-fasodata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - faso
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fasodata}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - faso
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── MinIO (stockage) ─────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    # En prod : console MinIO non exposée publiquement (accès via tunnel SSH si besoin)
    networks:
      - faso
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Meilisearch ─────────────────────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.7
    environment:
      MEILI_MASTER_KEY:    ${MEILISEARCH_API_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    networks:
      - faso
    restart: unless-stopped

networks:
  faso:
    driver: bridge
    name: fasodata_prod

volumes:
  db_data:
  redis_data:
  minio_data:
  meili_data:
