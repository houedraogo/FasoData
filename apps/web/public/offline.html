<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FasoData — Hors connexion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1A2C42; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: white; border-radius: 20px; padding: 40px 32px;
      max-width: 400px; width: 100%; text-align: center;
    }
    .icon { font-size: 56px; margin-bottom: 16px; }
    h1 { color: #1A2C42; font-size: 22px; margin-bottom: 8px; }
    p { color: #6b7280; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
    .btn {
      display: inline-block; background: #E04E2F; color: white;
      font-weight: 600; padding: 12px 28px; border-radius: 12px;
      text-decoration: none; font-size: 14px; cursor: pointer; border: none;
    }
    .hint {
      margin-top: 20px; font-size: 12px; color: #9ca3af;
      background: #f3f4f6; border-radius: 10px; padding: 12px;
    }
    .hint strong { color: #374151; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Pas de connexion internet</h1>
    <p>
      Vous êtes actuellement hors ligne. La page demandée n'est pas disponible sans connexion.
    </p>
    <button class="btn" onclick="window.location.href='/terrain'">
      📝 Saisie hors-ligne →
    </button>
    <div class="hint">
      <strong>La page /terrain fonctionne sans internet.</strong><br>
      Vos relevés seront synchronisés automatiquement dès le retour de la connexion.
    </div>
  </div>
</body>
</html>
